name: cbl-backoffice
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cbl
      POSTGRES_PASSWORD: cbl
      POSTGRES_DB: backoffice
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbl -d backoffice"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cbl-net]
  backoffice:
    profiles: ["app"]
    build:
      context: ..
    environment:
      HTTP_ADDR: ":8020"
      METRICS_ADDR: ":9220"
      PG_DSN: postgres://cbl:cbl@postgres:5432/backoffice?sslmode=disable
    ports:
      - "8020:8020"
      - "9220:9220"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [cbl-net]

volumes:
  pg-data:

networks:
  cbl-net:
    driver: bridge
